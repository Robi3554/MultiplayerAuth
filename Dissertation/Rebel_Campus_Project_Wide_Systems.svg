<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #4b5563; }
      .groupTitle { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 12; }
      .author { fill: #eff6ff; stroke: #2563eb; }
      .team { fill: #f0fdf4; stroke: #16a34a; }
      .shared { fill: #fff7ed; stroke: #ea580c; }
      .data { fill: #f5f3ff; stroke: #7c3aed; }
      .core { fill: #ffffff; stroke: #111827; stroke-width: 2.4; }
      .arrow { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
      .legendText { font: 400 13px Arial, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1250" fill="#ffffff"/>

  <text x="60" y="58" class="title">Rebel Campus - Project-Wide High-Level Systems Diagram</text>
  <text x="60" y="88" class="subtitle">Complete project view including multiplayer/session architecture, player control, combat, AI, world systems, UI/HUD, analytics, and team-wide gameplay features.</text>

  <!-- Legend -->
  <rect x="60" y="112" width="20" height="14" class="box author"/>
  <text x="90" y="125" class="legendText">Author-heavy systems and integration work</text>
  <rect x="370" y="112" width="20" height="14" class="box team"/>
  <text x="400" y="125" class="legendText">Team gameplay systems / colleague contributions</text>
  <rect x="730" y="112" width="20" height="14" class="box shared"/>
  <text x="760" y="125" class="legendText">Shared or cross-cutting systems</text>
  <rect x="1010" y="112" width="20" height="14" class="box data"/>
  <text x="1040" y="125" class="legendText">Data, feedback, analytics, and UI</text>

  <!-- Core -->
  <rect x="690" y="165" width="420" height="90" class="box core"/>
  <text x="735" y="200" class="label">Rebel Campus</text>
  <text x="735" y="224" class="small">Unity 6 multiplayer twin-stick shooter</text>
  <text x="735" y="246" class="small">FishNet networking + server-authoritative match flow</text>

  <!-- Group 1 -->
  <rect x="60" y="305" width="505" height="300" class="group"/>
  <text x="88" y="336" class="groupTitle">Session, Networking, and Match Flow</text>

  <rect x="95" y="365" width="200" height="70" class="box author"/>
  <text x="115" y="393" class="label">Menu + IP Connect</text>
  <text x="115" y="416" class="small">Username + server address</text>

  <rect x="330" y="365" width="200" height="70" class="box author"/>
  <text x="350" y="393" class="label">Networked Lobby</text>
  <text x="350" y="416" class="small">Teams, mode vote, ready</text>

  <rect x="95" y="470" width="200" height="70" class="box author"/>
  <text x="115" y="498" class="label">Server Spawning</text>
  <text x="115" y="521" class="small">Selected prefab + team</text>

  <rect x="330" y="470" width="200" height="70" class="box author"/>
  <text x="350" y="498" class="label">Game Modes</text>
  <text x="350" y="521" class="small">Deathmatch + FFA</text>

  <rect x="210" y="555" width="205" height="70" class="box author"/>
  <text x="230" y="583" class="label">Server Lifecycle</text>
  <text x="230" y="606" class="small">UPT server, late join, reset</text>

  <!-- Group 2 -->
  <rect x="640" y="305" width="520" height="300" class="group"/>
  <text x="668" y="336" class="groupTitle">Player Controller and Local Feedback</text>

  <rect x="675" y="365" width="200" height="70" class="box author"/>
  <text x="695" y="393" class="label">Input System</text>
  <text x="695" y="416" class="small">Keyboard, gamepad, mobile</text>

  <rect x="925" y="365" width="200" height="70" class="box author"/>
  <text x="945" y="393" class="label">Character Movement</text>
  <text x="945" y="416" class="small">Move, rotate, dash, jump</text>

  <rect x="675" y="470" width="200" height="70" class="box author"/>
  <text x="695" y="498" class="label">Cinemachine Camera</text>
  <text x="695" y="521" class="small">Local owner control</text>

  <rect x="925" y="470" width="200" height="70" class="box shared"/>
  <text x="945" y="498" class="label">Animation Trees</text>
  <text x="945" y="521" class="small">Animator + NetworkAnimator</text>

  <rect x="800" y="555" width="205" height="70" class="box data"/>
  <text x="820" y="583" class="label">PlayerStats</text>
  <text x="820" y="606" class="small">Health, kills, deaths, team</text>

  <!-- Group 3 -->
  <rect x="1235" y="305" width="505" height="300" class="group"/>
  <text x="1263" y="336" class="groupTitle">Combat and Weapons</text>

  <rect x="1270" y="365" width="200" height="70" class="box team"/>
  <text x="1290" y="393" class="label">Change Weapon</text>
  <text x="1290" y="416" class="small">Weapon index + HUD icon</text>

  <rect x="1505" y="365" width="200" height="70" class="box team"/>
  <text x="1525" y="393" class="label">Weapon Base</text>
  <text x="1525" y="416" class="small">Ammo, reload, cooldown</text>

  <rect x="1270" y="470" width="200" height="70" class="box team"/>
  <text x="1290" y="498" class="label">Raycast Weapons</text>
  <text x="1290" y="521" class="small">Client-reported hits</text>

  <rect x="1505" y="470" width="200" height="70" class="box team"/>
  <text x="1525" y="498" class="label">Projectile System</text>
  <text x="1525" y="521" class="small">Server-spawned projectiles</text>

  <rect x="1388" y="555" width="200" height="70" class="box team"/>
  <text x="1408" y="583" class="label">Melee Combat</text>
  <text x="1408" y="606" class="small">Slash timing + damage</text>

  <!-- Group 4 -->
  <rect x="60" y="685" width="620" height="300" class="group"/>
  <text x="88" y="716" class="groupTitle">AI, World, Pickups, VFX, and Lighting</text>

  <rect x="95" y="745" width="200" height="70" class="box team"/>
  <text x="115" y="773" class="label">AI Spawn System</text>
  <text x="115" y="796" class="small">RobotSpawnManager</text>

  <rect x="330" y="745" width="200" height="70" class="box team"/>
  <text x="350" y="773" class="label">Kamikaze Robot</text>
  <text x="350" y="796" class="small">Patrol, chase, explode</text>

  <rect x="95" y="850" width="200" height="70" class="box team"/>
  <text x="115" y="878" class="label">Little Robot</text>
  <text x="115" y="901" class="small">Patrol, flee, powerup</text>

  <rect x="330" y="850" width="200" height="70" class="box author"/>
  <text x="350" y="878" class="label">Turret AI</text>
  <text x="350" y="901" class="small">Server target + fire</text>

  <rect x="555" y="745" width="95" height="70" class="box shared"/>
  <text x="570" y="773" class="label">Pickup</text>
  <text x="570" y="796" class="small">Health</text>

  <rect x="555" y="850" width="95" height="70" class="box shared"/>
  <text x="570" y="878" class="label">VFX</text>
  <text x="570" y="901" class="small">Lighting</text>

  <!-- Group 5 -->
  <rect x="760" y="685" width="980" height="300" class="group"/>
  <text x="788" y="716" class="groupTitle">UI, HUD, Feedback, Analytics, and External Data</text>

  <rect x="795" y="745" width="190" height="70" class="box data"/>
  <text x="815" y="773" class="label">Player HUD</text>
  <text x="815" y="796" class="small">Health, ammo, weapon</text>

  <rect x="1025" y="745" width="190" height="70" class="box data"/>
  <text x="1045" y="773" class="label">Scoreboard</text>
  <text x="1045" y="796" class="small">Kills, deaths, players</text>

  <rect x="1255" y="745" width="190" height="70" class="box data"/>
  <text x="1275" y="773" class="label">Kill Feed</text>
  <text x="1275" y="796" class="small">Combat events</text>

  <rect x="1485" y="745" width="190" height="70" class="box data"/>
  <text x="1505" y="773" class="label">Death Screen</text>
  <text x="1505" y="796" class="small">Respawn feedback</text>

  <rect x="795" y="850" width="190" height="70" class="box data"/>
  <text x="815" y="878" class="label">Analytics</text>
  <text x="815" y="901" class="small">Logs and results</text>

  <rect x="1025" y="850" width="190" height="70" class="box data"/>
  <text x="1045" y="878" class="label">Audio Feedback</text>
  <text x="1045" y="901" class="small">Shots, jumps, damage</text>

  <rect x="1255" y="850" width="190" height="70" class="box author"/>
  <text x="1275" y="878" class="label">Mobile UI</text>
  <text x="1275" y="901" class="small">Twin-stick controls</text>

  <rect x="1485" y="850" width="190" height="70" class="box shared"/>
  <text x="1505" y="878" class="label">Loading UI</text>
  <text x="1505" y="901" class="small">Scene transitions</text>

  <!-- Note -->
  <rect x="110" y="1045" width="1580" height="78" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" rx="12"/>
  <text x="135" y="1074" class="small">This diagram presents the full project at a high level. Blue systems are author-heavy contributions, green systems are mainly broader team gameplay work, orange systems are shared integrations, and purple systems are UI/data feedback.</text>
  <text x="135" y="1100" class="small">The most important integration point is the FishNet server-authoritative flow: lobby state, spawning, combat outcomes, match results, late join admission, and return-to-lobby are coordinated through server-owned systems.</text>

  <!-- Arrows from core -->
  <path d="M820 255 L430 365" class="arrow"/>
  <path d="M900 255 L900 365" class="arrow"/>
  <path d="M980 255 L1370 365" class="arrow"/>
  <path d="M820 255 L430 745" class="arrow dashed"/>
  <path d="M980 255 L1255 745" class="arrow dashed"/>

  <!-- Session arrows -->
  <path d="M295 400 L330 400" class="arrow"/>
  <path d="M430 435 L205 470" class="arrow"/>
  <path d="M295 505 L330 505" class="arrow"/>
  <path d="M430 540 L315 555" class="arrow"/>

  <!-- Player arrows -->
  <path d="M875 400 L925 400" class="arrow"/>
  <path d="M1025 435 L775 470" class="arrow"/>
  <path d="M1025 435 L1025 470" class="arrow"/>
  <path d="M1025 540 L905 555" class="arrow"/>

  <!-- Combat arrows -->
  <path d="M1470 400 L1505 400" class="arrow"/>
  <path d="M1605 435 L1370 470" class="arrow"/>
  <path d="M1605 435 L1605 470" class="arrow"/>
  <path d="M1605 540 L1488 555" class="arrow"/>

  <!-- AI arrows -->
  <path d="M295 780 L330 780" class="arrow"/>
  <path d="M295 780 L195 850" class="arrow"/>
  <path d="M530 885 L555 885" class="arrow"/>
  <path d="M530 780 L555 780" class="arrow"/>

  <!-- UI arrows -->
  <path d="M905 625 L890 745" class="arrow"/>
  <path d="M905 625 L1120 745" class="arrow"/>
  <path d="M1488 625 L1350 745" class="arrow"/>
  <path d="M905 625 L1580 745" class="arrow dashed"/>
  <path d="M775 540 L1350 850" class="arrow dashed"/>
  <path d="M430 625 L890 850" class="arrow dashed"/>

  <!-- Cross-system authority arrows -->
  <path d="M430 470 C700 620 1120 620 1370 540" class="arrow dashed"/>
  <path d="M1605 540 C1450 660 1040 665 905 625" class="arrow dashed"/>
  <path d="M430 540 C610 680 840 720 1025 780" class="arrow dashed"/>

  <!-- Labels -->
  <text x="560" y="350" class="tiny">session flow</text>
  <text x="920" y="350" class="tiny">local control</text>
  <text x="1160" y="350" class="tiny">combat loop</text>
  <text x="1040" y="640" class="tiny">state drives UI</text>
  <text x="1210" y="650" class="tiny">server outcomes</text>
  <text x="630" y="675" class="tiny">match feedback</text>
</svg>
